<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2eee4"><title>胆敢造词：混乱派对</title><style>:root{--bg:#f2eee4;--ink:#171714;--paper:#fffaf0;--red:#e85d3b;--yellow:#efc94d;--muted:#736f67}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid;padding-bottom:14px}.brand{font-weight:1000;font-size:22px}.btn{border:2px solid var(--ink);background:transparent;border-radius:5px;padding:10px 14px;font-weight:900;cursor:pointer}.primary{background:var(--red);color:white}.yellow{background:var(--yellow)}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;padding:70px 0}.hero h1{font-size:clamp(56px,9vw,112px);line-height:.85;letter-spacing:-.08em;margin:0 0 28px}.lead{font-size:22px;font-weight:750;max-width:650px}.panel{border-top:6px solid;padding-top:18px}.field{border-bottom:1px solid;padding:16px 0}.field label{display:block;font-weight:900;margin-bottom:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.input{width:100%;padding:11px;border:2px solid;border-radius:4px;background:var(--paper)}.names{display:grid;gap:8px}.mode.active{background:var(--yellow)}.game{display:none}.meta{display:flex;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid;color:var(--muted);font-weight:800}.scores{display:grid;grid-template-columns:repeat(var(--n),minmax(130px,1fr));overflow:auto;border-bottom:2px solid}.score{padding:14px;min-width:130px}.score+.score{border-left:1px solid}.score b{font-size:19px}.num{font-size:34px;font-weight:1000}.layout{display:grid;grid-template-columns:230px 1fr;gap:30px;padding-top:28px}.side{border-top:5px solid;padding-top:12px}.turn{font-size:32px;font-weight:1000}.challenge{background:var(--yellow);border:2px solid;padding:12px;margin-top:20px;transform:rotate(-1deg)}.tableHead{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid}.cards{display:flex;flex-wrap:wrap;gap:12px;min-height:320px;padding:30px 0}.card{width:74px;aspect-ratio:.72;border:3px solid;border-radius:6px;background:var(--paper);display:grid;place-items:center;font-size:42px;font-weight:1000;cursor:pointer}.card.sel{background:var(--yellow)}.actions{display:flex;gap:10px;flex-wrap:wrap}.log{font-size:13px;margin-top:24px;border-top:1px solid}.log div{padding:8px 0;border-bottom:1px dotted #999}.overlay{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:var(--bg);border:3px solid;max-width:700px;width:100%;max-height:92vh;overflow:auto;padding:22px}.modal h2{font-size:38px;margin:0 0 16px}.choice{display:flex;gap:8px;flex-wrap:wrap}.choice button.active{background:var(--yellow)}.selected{font-size:25px;font-weight:900;padding:12px 0}.error{color:#b33127;font-weight:900;min-height:24px}.vote{display:grid;gap:14px;text-align:center}.phrase{font-size:42px;font-weight:1000;border-top:2px solid;border-bottom:2px solid;padding:18px}.end{text-align:center;padding:70px 0}.end h2{font-size:60px}.hidden{display:none!important}@media(max-width:760px){.hero,.layout{grid-template-columns:1fr}.hero{padding:35px 0;gap:30px}.side{position:static}.cards{min-height:230px}.card{width:62px;font-size:35px}.top{align-items:flex-start}.top .row{justify-content:flex-end}.wrap{padding:14px}.modal h2{font-size:30px}}</style></head><body><main class="wrap"><header class="top"><div class="brand">胆敢造词 · 混乱派对</div><div class="row"><button class="btn" id="rulesBtn">规则</button><button class="btn hidden" id="resetBtn">重新开局</button></div></header><section id="setup" class="hero"><div><h1>翻字牌。<br>拼脑洞。<br>靠嘴赢。</h1><p class="lead">2–6 人同屏派对桌游。用桌面汉字和自己的手牌组成至少 3 字的合理词句，说服全桌，把牌赢走。</p></div><div class="panel"><div class="field"><label>模式</label><div class="row"><button class="btn mode active" data-mode="classic">经典派对</button><button class="btn mode" data-mode="duel">双人嘴硬战</button></div></div><div class="field"><label>玩家人数</label><div class="row"><button class="btn" id="minus">−</button><strong id="count" style="font-size:26px;padding:6px 10px">3</strong><button class="btn" id="plus">＋</button></div></div><div class="field"><label>玩家名字</label><div id="names" class="names"></div></div><div class="field"><label>认可规则</label><select id="voteMode" class="input"><option value="majority">多数通过</option><option value="unanimous">全票通过</option></select></div><div class="field"><label>混乱挑战</label><select id="chaos" class="input"><option value="2">每 2 次成功刷新</option><option value="3">每 3 次成功刷新</option><option value="0">关闭</option></select></div><button class="btn primary" id="start" style="width:100%;margin-top:20px">开始造词</button></div></section><section id="game" class="game"><div id="meta" class="meta"></div><div id="scores" class="scores"></div><div class="layout"><aside class="side"><small>当前翻牌玩家</small><div id="turn" class="turn"></div><div id="challenge" class="challenge"></div><div class="log" id="log"></div></aside><section><div class="tableHead"><div><small>公共区域</small><h2 style="font-size:45px;margin:0">桌面字牌</h2></div><strong id="deckInfo"></strong></div><div class="cards" id="cards"></div><div class="actions"><button class="btn yellow" id="draw">翻一张</button><button class="btn primary" id="claim">我能造词</button><button class="btn" id="finish">结束并结算</button></div></section></div></section><section id="end" class="end hidden"></section></main><div id="modal"></div><script>const chars=('我你他她它们的是了在有不和人这中大为上个国到说年地也子时道出而要于就下得可会过天去能对小多然家学么心好爱一只真来成发想作当没看起现前开手日又行意动方期它头经长回位分后最同新里很外民点正些三本从无情己面最女但体表问力机给等几十其公已知此还理事都种把想生样再应间将很因才用者二如水见明度高自太笑话美吃喝玩走哭吧吗呢啊呀哦哈快慢黑白红花雨风云山海月星光梦钱猫狗猪鱼鸟饭酒火土木金').split('');let setup={mode:'classic',count:3};let state=null;const challenges=[['新闻播报','组成一句像新闻标题的话'],['禁止代词','词句中不能出现“我、你、他”'],['反派宣言','用反派口吻读出词句'],['夸张广告','把词句说成广告口号'],['一网打尽','必须使用当前所有桌面牌'],['感情充沛','必须带情绪表演出来']];const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function renderNames(){let n=setup.mode==='duel'?2:setup.count;$('#names').innerHTML=Array.from({length:n},(_,i)=>`<input class="input pname" value="玩家${i+1}" maxlength="10">`).join('');$('#count').textContent=n;$('#minus').disabled=setup.mode==='duel'||n<=2;$('#plus').disabled=setup.mode==='duel'||n>=6}renderNames();$$('.mode').forEach(b=>b.onclick=()=>{setup.mode=b.dataset.mode;$$('.mode').forEach(x=>x.classList.toggle('active',x===b));if(setup.mode==='duel')setup.count=2;else if(setup.count<2)setup.count=3;renderNames()});$('#minus').onclick=()=>{setup.count=Math.max(2,setup.count-1);renderNames()};$('#plus').onclick=()=>{setup.count=Math.min(6,setup.count+1);renderNames()};function start(){let names=$$('.pname').map((x,i)=>x.value.trim()||`玩家${i+1}`),deck=shuffle([...chars,...chars.slice(0,28)].map((c,i)=>({id:i+'-'+Math.random(),c})));state={mode:setup.mode,players:names.map(n=>({name:n,hand:deck.pop(),cards:[],stars:0,blocked:false,veto:3})),deck,table:[],turn:0,success:0,round:1,voteMode:$('#voteMode').value,chaos:+$('#chaos').value,challenge:null,log:[]};$('#setup').classList.add('hidden');$('#game').style.display='block';$('#resetBtn').classList.remove('hidden');nextChallenge();render()}function nextChallenge(){if(state.chaos&&state.success&&state.success%state.chaos===0)state.challenge=challenges[Math.floor(Math.random()*challenges.length)];else if(!state.success)state.challenge=null}function score(p){return p.cards.length+p.stars}function render(){document.documentElement.style.setProperty('--n',state.players.length);$('#meta').innerHTML=`<span>${state.mode==='classic'?'经典派对':'双人嘴硬战'}</span><span>牌堆 ${state.deck.length}</span><span>桌面 ${state.table.length}</span><span>第 ${state.round} 轮</span>`;$('#scores').innerHTML=state.players.map((p,i)=>`<div class="score"><b>${esc(p.name)}${i===state.turn?' · 翻牌':''}</b><div class="num">${score(p)}</div><small>${p.cards.length} 张牌 · ${p.stars} 星${p.blocked?' · 卡壳':''}${state.mode==='duel'?` · 否决 ${p.veto}`:''}</small></div>`).join('');$('#turn').textContent=state.players[state.turn].name;$('#deckInfo').textContent=`剩余 ${state.deck.length} 张`;$('#challenge').innerHTML=state.challenge?`<b>${state.challenge[0]}</b><br>${state.challenge[1]}`:'<b>自由发挥</b><br>只要全桌觉得合理就算。';$('#cards').innerHTML=state.table.length?state.table.map((x,i)=>`<div class="card" style="transform:rotate(${(i%5-2)*1.3}deg)">${x.c}</div>`).join(''):'<p style="color:var(--muted)">桌面还是空的，先翻牌。</p>';$('#claim').disabled=state.table.length+(state.players.some(p=>p.hand)?1:0)<3;$('#draw').disabled=!state.deck.length;$('#log').innerHTML=state.log.slice(-5).reverse().map(x=>`<div>${esc(x)}</div>`).join('')}function draw(){if(!state.deck.length)return;state.players.forEach(p=>p.blocked=false);state.table.push(state.deck.pop());state.log.push(`${state.players[state.turn].name} 翻出“${state.table.at(-1).c}”`);render()}$('#draw').onclick=draw;function claim(){let eligible=state.players.map((p,i)=>({p,i})).filter(x=>!x.p.blocked&&state.table.length+(x.p.hand?1:0)>=3);if(!eligible.length)return;let sel=[],who=eligible[0].i,useHand=false;function show(err=''){$('#modal').innerHTML=`<div class="overlay"><div class="modal"><h2>谁敢造词？</h2><label><b>抢答玩家</b></label><div class="choice">${eligible.map(x=>`<button class="btn who ${x.i===who?'active':''}" data-i="${x.i}">${esc(x.p.name)}</button>`).join('')}</div><p><b>选择桌面牌</b></p><div class="cards" style="min-height:0;padding:12px 0">${state.table.map((x,i)=>`<button class="card pick ${sel.includes(i)?'sel':''}" data-i="${i}">${x.c}</button>`).join('')}</div><p><b>自己的手牌</b></p><button class="card hand ${useHand?'sel':''}">${state.players[who].hand?state.players[who].hand.c:'无'}</button><div class="selected">已选 ${sel.length+(useHand?1:0)} 张</div><input id="phrase" class="input" placeholder="输入组成的词句"><input id="reason" class="input" style="margin-top:8px" placeholder="说服理由或使用场景"><div class="error">${esc(err)}</div><div class="row"><button class="btn" id="cancel">取消</button><button class="btn primary" id="submit">提交投票</button></div></div></div>`;$$('.who').forEach(b=>b.onclick=()=>{who=+b.dataset.i;useHand=false;show()});$$('.pick').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;sel=sel.includes(i)?sel.filter(x=>x!==i):[...sel,i];show()});$('.hand').onclick=()=>{if(state.players[who].hand){useHand=!useHand;show()}};$('#cancel').onclick=()=>$('#modal').innerHTML='';$('#submit').onclick=()=>{let phrase=$('#phrase').value.replace(/[\s，。！？、,.!?]/g,''),chosen=sel.map(i=>state.table[i].c).concat(useHand?[state.players[who].hand.c]:[]);if(chosen.length<3)return show('至少选择 3 张牌。');let a=[...phrase].sort().join(''),b=[...chosen].sort().join('');if(a!==b)return show('词句中的汉字必须与所选牌完全一致。');vote(who,sel,useHand,phrase,$('#reason').value)}}show()}$('#claim').onclick=claim;function vote(who,sel,useHand,phrase,reason){let voters=state.players.map((_,i)=>i).filter(i=>i!==who),yes=0,c=0;function step(){if(c>=voters.length){let ok=state.voteMode==='unanimous'?yes===voters.length:yes>voters.length/2;resolve(ok);return}let v=voters[c];$('#modal').innerHTML=`<div class="overlay"><div class="modal vote"><small>秘密投票 ${c+1}/${voters.length}</small><h2>${esc(state.players[v].name)}</h2><div class="phrase">${esc(phrase)}</div><p>${esc(reason||'抢答者没有解释。')}</p><button class="btn primary" id="yes">认可</button><button class="btn" id="no">不认可</button></div></div>`;$('#yes').onclick=()=>{yes++;c++;step()};$('#no').onclick=()=>{c++;step()}}function resolve(ok){let p=state.players[who];if(ok){let taken=sel.sort((a,b)=>b-a).map(i=>state.table.splice(i,1)[0]);p.cards.push(...taken);if(useHand&&p.hand){p.cards.push(p.hand);p.hand=state.deck.pop()||null}let n=taken.length+(useHand?1:0),bonus=n>=6?2:n>=4?1:0;if(state.table.length===0)bonus++;if(state.challenge)bonus++;p.stars+=bonus;state.success++;state.turn=who;state.log.push(`${p.name} 用“${phrase}”赢得 ${n} 张牌${bonus?`和 ${bonus} 星`:''}`);nextChallenge()}else{p.blocked=true;state.log.push(`${p.name} 的“${phrase}”未获认可`)}state.round++;$('#modal').innerHTML='';render()}step()}function finish(){let rank=[...state.players].sort((a,b)=>score(b)-score(a));$('#game').style.display='none';$('#end').classList.remove('hidden');$('#end').innerHTML=`<h2>${esc(rank[0].name)} 获胜</h2><p style="font-size:24px">${rank.map((p,i)=>`${i+1}. ${esc(p.name)}：${score(p)} 分`).join('<br>')}</p><button class="btn primary" onclick="location.reload()">再来一局</button>`}$('#finish').onclick=finish;$('#start').onclick=start;$('#resetBtn').onclick=()=>location.reload();$('#rulesBtn').onclick=()=>{$('#modal').innerHTML=`<div class="overlay"><div class="modal"><h2>修订版规则</h2><p><b>1.</b> 当前玩家逐张翻牌，任何未卡壳玩家都可抢答。</p><p><b>2.</b> 使用任意桌面牌，加上自己的手牌，组成至少 3 字的合理词句。每张牌只能用一次。</p><p><b>3.</b> 只有实际用于组词的牌计分；未使用的桌面牌继续保留。</p><p><b>4.</b> 其他玩家秘密投票。成功后抢答者收牌并成为新的翻牌玩家；失败则在下一张牌翻开前暂时不能抢答。</p><p><b>5.</b> 4–5 字奖励 1 星，6 字以上奖励 2 星；清空桌面、完成混乱挑战各奖励 1 星。</p><p><b>6.</b> 牌堆耗尽且无人能继续组词时结束，牌数＋派对星最高者获胜。</p><button class="btn primary" onclick="document.querySelector('#modal').innerHTML=''">明白了</button></div></div>`}</script></body></html>
